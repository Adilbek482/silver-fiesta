<style>
:root{

  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#ECF1EE; --ink:#15201C; --muted:#4B5752; --line:#D7DED9;
  --nav:#0F2A24; --nav-ink:#E6EFEB; --nav-muted:#9DB8AE; --nav-hover:#173A32; --nav-active:#E6EFEB; --nav-active-ink:#0F2A24;
  --accent:#0F5C4D; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6;
  --crit:#A3261A; --crit-soft:#FBE5E2; --warn:#8A4B00; --warn-soft:#FCEED6; --info:#1F4FA0; --info-soft:#E1E9F8;
  --ok:#0E6B47; --ok-soft:#DCF1E6; --none:#8C9893; --focus:#1F6FEB; --backdrop:rgba(10,20,17,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1513; --surface:#16201D; --surface-2:#1D2A26; --ink:#E4ECE8; --muted:#A7B6B0; --line:#2C3C37;
    --nav:#0A1B17; --nav-ink:#DCE8E3; --nav-muted:#8EA79E; --nav-hover:#14302A; --nav-active:#DCE8E3; --nav-active-ink:#0A1B17;
    --accent:#5CC2A6; --accent-ink:#04231C; --accent-soft:#163A31;
    --crit:#FF9E91; --crit-soft:#3A1B17; --warn:#F2B866; --warn-soft:#352713; --info:#9DBBF2; --info-soft:#18253B;
    --ok:#7AD3A6; --ok-soft:#14302A; --none:#6F7D78; --focus:#7FB0FF; --backdrop:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1513; --surface:#16201D; --surface-2:#1D2A26; --ink:#E4ECE8; --muted:#A7B6B0; --line:#2C3C37;
  --nav:#0A1B17; --nav-ink:#DCE8E3; --nav-muted:#8EA79E; --nav-hover:#14302A; --nav-active:#DCE8E3; --nav-active-ink:#0A1B17;
  --accent:#5CC2A6; --accent-ink:#04231C; --accent-soft:#163A31;
  --crit:#FF9E91; --crit-soft:#3A1B17; --warn:#F2B866; --warn-soft:#352713; --info:#9DBBF2; --info-soft:#18253B;
  --ok:#7AD3A6; --ok-soft:#14302A; --none:#6F7D78; --focus:#7FB0FF; --backdrop:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}

.shell{display:flex;min-height:100vh}
.side-wrap{width:264px;flex:none;background:var(--nav);color:var(--nav-ink)}
.side{position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;padding:22px 14px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:#3FB68B;color:#0F2A24;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.brand-name{font-weight:700;font-size:18px}
.brand-sub{font-size:12px;color:var(--nav-muted)}
.menu-btn{display:none;margin-left:auto;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #2E4C44;background:transparent;color:var(--nav-ink);font-weight:600;cursor:pointer}
.nav-groups{display:flex;flex-direction:column;gap:16px}
.nav-group-title{font-size:12px;color:var(--nav-muted);padding:0 10px 4px;font-weight:600}
.nav-link{display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 10px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-size:14.5px}
.nav-link:hover{background:var(--nav-hover)}
.nav-link[aria-current="page"]{background:var(--nav-active);color:var(--nav-active-ink);font-weight:600}
.nav-link .code{font-size:12px;color:var(--nav-muted)}
.nav-link[aria-current="page"] .code{color:#3D5C53}
.nav-count{margin-left:auto;min-width:24px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;text-align:center;background:#2A4A42;color:#E6EFEB}
.nav-count.has-crit{background:#C2412F;color:#FFFFFF}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--nav-muted);padding:10px;border:1px solid #2A463F;border-radius:10px;line-height:1.5}

.main{flex:1;min-width:0;padding:28px 36px 72px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumbs{font-size:13.5px;color:var(--muted)}
.page-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:72ch;margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:13.5px;color:var(--muted)}
.kpi-value{font-size:30px;font-weight:600;letter-spacing:-.01em}
.kpi-sub{font-size:13px;color:var(--muted)}
.kpi-sub.crit{color:var(--crit);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:17px;font-weight:600}
.panel-sub{font-size:13.5px;color:var(--muted);margin-top:-8px}
.note{font-size:13.5px;color:var(--muted);line-height:1.55}
.note strong{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--accent);padding:0 8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted);min-width:0}
.field input,.field select{min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14.5px;width:100%}
.inline-input{min-height:34px;width:84px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);text-align:right}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.b-crit{background:var(--crit-soft);color:var(--crit)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-none{background:var(--surface-2);color:var(--muted)}
.t-crit{color:var(--crit)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)} .t-muted{color:var(--muted)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:600;background:var(--surface-2)}
.tbl tr.hl td{background:var(--accent-soft)}
.tbl tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.tbl tr.flag-crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}

.strikes{display:flex;flex-direction:column;gap:8px}
.strike{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;color:var(--ink)}
.strike:hover{border-color:var(--accent)}
.strike-title{font-weight:600;font-size:14.5px}
.strike-meta{font-size:13px;color:var(--muted)}
.strike-amt{text-align:right;white-space:nowrap;font-weight:600}
.strike-status{font-size:12px;color:var(--muted);text-align:right}
.strike.closed{opacity:.62}
.empty{padding:22px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;background:var(--surface)}

.close-bar{display:flex;gap:4px;height:44px}
.close-seg{flex:1;border-radius:6px;min-width:10px;border:0;padding:0;cursor:pointer}
.seg-done{background:var(--ok)} .seg-open{background:var(--crit)} .seg-warn{background:#D08A24} .seg-manual{background:var(--line)} .seg-nodata{background:repeating-linear-gradient(45deg,var(--line),var(--line) 4px,transparent 4px,transparent 8px)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.module-table td a{font-weight:600;text-decoration:none}
.module-table td a:hover{text-decoration:underline}

.ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ds{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ds h3{font-size:15.5px}
.ds details{font-size:13px;color:var(--muted)}
.ds summary{cursor:pointer;font-weight:600;color:var(--ink)}
.ds code{font-family:inherit;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.msg{font-size:13px;padding:8px 10px;border-radius:8px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.err{background:var(--crit-soft);color:var(--crit)}
.file-label{position:relative;overflow:hidden}
.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}

.drawer-back{position:fixed;inset:0;background:var(--backdrop);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:41;overflow:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.drawer h2{font-size:22px;line-height:1.3}
.d-sec{display:flex;flex-direction:column;gap:4px}
.d-sec .lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.d-entry{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.d-amt{font-size:24px;font-weight:600}
.ai-out{white-space:pre-wrap;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14.5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60}

@media (max-width: 900px){
  .shell{flex-direction:column}
  .side-wrap{width:100%}
  .side{position:static;max-height:none;padding:12px 14px}
  .menu-btn{display:inline-flex;align-items:center}
  .nav-groups,.side-foot{display:none}
  .side.open .nav-groups{display:flex}
  .main{padding:20px 16px 56px}
  .page-head h1{font-size:23px}
}
@media (prefers-reduced-motion: no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- formatting ---------- */
const NF0 = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const NF1 = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1});
const NF2 = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money = n => NF0.format(Math.round(n||0)) + ' ₸';
const moneyM = n => Math.abs(n) >= 1e6 ? NF1.format(n/1e6) + ' млн ₸' : money(n);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const D = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(Date.UTC(+m[1], +m[2]-1, +m[3])) : null; };
const fd = s => { const d = D(s); return d ? String(d.getUTCDate()).padStart(2,'0') + '.' + String(d.getUTCMonth()+1).padStart(2,'0') + '.' + d.getUTCFullYear() : '—'; };
const mi = d => d.getUTCFullYear()*12 + d.getUTCMonth();
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c); };

/* ---------- schemas ---------- */
const SCHEMAS = {
  entries: { title:'Проводки', desc:'Журнал проводок из 1С за период и 3 предыдущих месяца.', cols:[
    ['date','Дата','d'],['doc','Документ','s'],['debit','Дт','s'],['credit','Кт','s'],['amount','Сумма','n'],['counterparty','Контрагент','s'],['description','Содержание','s'],['hasDoc','Первичка есть','b']]},
  esf: { title:'ЭСФ', desc:'Реестр входящих и исходящих ЭСФ из ИС ЭСФ с отметкой, отражён ли документ в учёте.', cols:[
    ['number','Номер ЭСФ','s'],['date','Дата','d'],['direction','Направление','s'],['counterparty','Контрагент','s'],['bin','БИН','s'],['net','Сумма без НДС','n'],['vat','НДС','n'],['rate','Ставка НДС, %','n'],['status','Статус ЭСФ','s'],['inBooks','Отражён в учёте','b'],['bookVat','НДС в учёте','n']]},
  counterparties: { title:'Контрагенты', desc:'Справочник контрагентов: статус по КГД, договор, сальдо по учёту и по акту сверки.', cols:[
    ['name','Контрагент','s'],['bin','БИН','s'],['kgd','Статус КГД','s'],['contractEnd','Договор действует до','d'],['bookBalance','Сальдо в учёте','n'],['actBalance','Сальдо по акту сверки','n'],['lastMovement','Последнее движение','d']]},
  payroll: { title:'Сотрудники', desc:'Начисления за месяц, применённый вычет и удержанный ИПН.', cols:[
    ['name','Сотрудник','s'],['salary','Начислено за месяц','n'],['deductionMRP','Вычет, МРП','n'],['ipn','ИПН удержан','n']]},
  deductions: { title:'Расходы к вычету по КПН', desc:'Расходы с категорией и отметкой, отнесены ли они на вычет.', cols:[
    ['expense','Расход','s'],['amount','Сумма','n'],['category','Категория','s'],['deducted','Отнесён на вычет','b']]},
  leases: { title:'Договоры аренды', desc:'Условия договоров аренды для расчёта по МСФО 16.', cols:[
    ['counterparty','Арендодатель','s'],['object','Объект','s'],['start','Начало аренды','d'],['term','Срок, мес.','n'],['payment','Платёж в месяц','n'],['rate','Ставка дисконтирования, % годовых','n'],['recognized','Признана по МСФО 16','b'],['bookLiability','Обязательство в учёте','n']]},
  receivables: { title:'Дебиторская задолженность', desc:'Долги покупателей с днями просрочки и начисленным резервом.', cols:[
    ['counterparty','Покупатель','s'],['amount','Сумма долга','n'],['days','Дней просрочки','n'],['reserve','Резерв в учёте','n']]},
  loans: { title:'Займы', desc:'Выданные и полученные займы со ставкой по договору и рыночной ставкой.', cols:[
    ['counterparty','Контрагент','s'],['type','Тип','s'],['principal','Сумма','n'],['rate','Ставка по договору, %','n'],['market','Рыночная ставка, %','n'],['term','Срок, мес.','n'],['discounted','Дисконтирован','b']]},
  revenue: { title:'Выручка', desc:'Документы реализации с датой передачи контроля и условиями ретро-бонусов.', cols:[
    ['doc','Документ','s'],['counterparty','Покупатель','s'],['recognized','Дата признания выручки','d'],['transfer','Дата передачи контроля','d'],['amount','Сумма','n'],['bonusPct','Ретро-бонус, %','n'],['bonusAccrued','Бонус начислен','n']]},
  fx: { title:'Валютные статьи', desc:'Остатки в иностранной валюте на конец периода.', cols:[
    ['item','Статья','s'],['type','Тип','s'],['currency','Валюта','s'],['amountFC','Сумма в валюте','n'],['rateBooked','Курс в учёте','n'],['revalAmount','Переоценка в учёте','n']]},
  inventory: { title:'Запасы', desc:'Остатки запасов с себестоимостью и чистой ценой продажи.', cols:[
    ['item','Номенклатура','s'],['qty','Количество','n'],['cost','Себестоимость за ед.','n'],['nrv','Чистая цена продажи за ед.','n'],['lastMovement','Последнее движение','d'],['writedown','Списание в учёте','n']]},
  assets: { title:'Основные средства', desc:'Карточки основных средств и незавершённого строительства.', cols:[
    ['name','Объект','s'],['status','Статус','s'],['date','Дата ввода или начала','d'],['cost','Первоначальная стоимость','n'],['life','Срок службы, мес.','n'],['accum','Накопленная амортизация','n']]},
  provisions: { title:'Резервы и оценочные обязательства', desc:'Оценка резервов против сумм в учёте.', cols:[
    ['type','Резерв','s'],['required','Оценка','n'],['booked','В учёте','n'],['term','Срок исполнения, мес.','n'],['discounted','Дисконтирован','b']]},
  temp: { title:'Временные разницы', desc:'Балансовая стоимость и налоговая база статей для расчёта отложенного налога.', cols:[
    ['item','Статья','s'],['side','Раздел баланса','s'],['carrying','Балансовая стоимость','n'],['taxBase','Налоговая база','n']]}
};
const DS_ORDER = Object.keys(SCHEMAS);

/* ---------- demo data ---------- */
const E = (date, doc, debit, credit, amount, counterparty, description, hasDoc) => ({date, doc, debit, credit, amount, counterparty, description, hasDoc});
function demoEntries(){
  const out = [];
  ['2026-06','2026-07','2026-08'].forEach((m, i) => {
    out.push(E(m+'-04','АВР-'+(410+i),'7210','3310',2000000,'ТОО «Сапа Девелопмент»','Аренда офиса',true));
    out.push(E(m+'-25','АВР-'+(520+i),'7210','3310',180000,'ТОО «Линк Телеком»','Услуги связи',true));
    out.push(E(m+'-24','СФ-'+(630+i),'7210','3310',640000,'ТОО «Энерго Сбыт»','Коммунальные услуги',true));
  });

function period(){
  const m = /^(\d{4})-(\d{2})$/.exec(S.settings.period) || [0, 2026, 9];
  const y = +m[1], mo = +m[2];
  const start = new Date(Date.UTC(y, mo-1, 1)), end = new Date(Date.UTC(y, mo, 0));
  return { y, m:mo, start, end, label: MONTHS[mo-1] + ' ' + y, iso: S.settings.period };
}
const inP = (s, P) => { const d = D(s); return !!d && d >= P.start && d <= P.end; };
const isPay = e => /^10/.test(e.debit) || /^10/.test(e.credit);

/* ---------- calculators ---------- */
function leaseCalc(l, P){
  const r = (l.rate || 0) / 100 / 12;
  const pv = (n) => r === 0 ? l.payment * n : l.payment * (1 - Math.pow(1 + r, -n)) / r;
  const st = D(l.start);
  let elapsed = st ? (mi(P.end) - mi(st) + 1) : 0;
  elapsed = Math.max(0, Math.min(l.term, elapsed));
  const remaining = Math.max(0, l.term - elapsed);
  const pv0 = pv(l.term);
  const liability = pv(remaining);
  const depMonthly = l.term ? pv0 / l.term : 0;
  const rou = Math.max(0, pv0 - depMonthly * elapsed);
  const shortTerm = l.term <= 12;
  return { r, pv0, elapsed, remaining, liability, depMonthly, rou, shortTerm,
    schedule(){
      const rows = []; let open = pv0;
      for (let i = 1; i <= l.term; i++) {
        const interest = open * r; const close = open + interest - l.payment;
        rows.push({ i, open, interest, payment: l.payment, close: Math.abs(close) < 1 ? 0 : close });
        open = close;
      }
      return rows;
    }
  };
}
const BUCKETS = [
  { name:'Не просрочено', test: d => d <= 0 },
  { name:'1–30 дней', test: d => d >= 1 && d <= 30 },
  { name:'31–90 дней', test: d => d >= 31 && d <= 90 },
  { name:'91–180 дней', test: d => d >= 91 && d <= 180 },
  { name:'Более 180 дней', test: d => d > 180 }
];
function eclCalc(rows){
  const rates = S.settings.ecl;
  const b = BUCKETS.map((bk, i) => {
    const items = rows.filter(r => bk.test(r.days || 0));
    const amount = sum(items, r => r.amount), booked = sum(items, r => r.reserve);
    return { name: bk.name, rate: rates[i] || 0, amount, booked, required: amount * (rates[i] || 0) / 100, count: items.length };
  });
  return { buckets: b, amount: sum(b, x => x.amount), required: sum(b, x => x.required), booked: sum(b, x => x.booked) };
}
function loanCalc(l){
  const t = (l.term || 0) / 12;
  const fv = l.principal * Math.pow(1 + (l.rate || 0) / 100, t);
  const pv = fv / Math.pow(1 + (l.market || 0) / 100, t);
  return { pv, effect: l.principal - pv, gap: (l.market || 0) - (l.rate || 0) };
}
function ipnExpected(p){
  const base = p.salary * 0.88 - (p.deductionMRP || 0) * S.settings.mrp;
  return Math.max(0, base) * 0.1;
}
function faCalc(a, P){
  const d = D(a.date);
  const used = d ? Math.max(0, mi(P.end) - mi(d)) : 0;
  const expected = a.life > 0 ? Math.min(a.cost, a.cost * used / a.life) : 0;
  return { used, expected, diff: (a.accum || 0) - expected };
}
function dtCalc(rows){
  const rate = S.settings.citRate / 100;
  const items = rows.map(r => {
    const diff = (r.carrying || 0) - (r.taxBase || 0);
    const dtl = /обяз/i.test(r.side) ? -diff * rate : diff * rate;
    return Object.assign({}, r, { diff, dtl });
  });
  return { items, net: sum(items, x => x.dtl) };
}
function turnover(name, P){
  return sum(S.data.entries.filter(e => e.counterparty === name && inP(e.date, P) && !isPay(e)), e => e.amount);
}

  ias2:{ t:'Запасы', code:'IAS 2', group:'МСФО', ifrs:true, needs:['inventory'], desc:'Оценка по наименьшей из себестоимости и чистой цены продажи, отрицательные остатки, неликвиды.' },
  ias16:{ t:'Основные средства', code:'IAS 16', group:'МСФО', ifrs:true, needs:['assets'], desc:'Начисление амортизации, сроки полезного использования и долгое незавершённое строительство.' },
  ias37:{ t:'Резервы', code:'IAS 37 и IAS 19', group:'МСФО', ifrs:true, needs:['provisions'], desc:'Полнота резервов (отпуска, бонусы, гарантии) и дисконтирование долгосрочных обязательств.' },
  ias12:{ t:'Отложенный налог', code:'IAS 12', group:'МСФО', ifrs:true, needs:['temp'], desc:'Расчёт отложенного налога по временным разницам и сравнение с учётом.' },
  close:{ t:'Закрытие периода', group:'Закрытие' },
  data:{ t:'Данные', group:'Система' },
  rules:{ t:'Библиотека проверок', group:'Система' },
  settings:{ t:'Настройки', group:'Система' }
};
const NAV = [
  { title:'', items:['overview','strikes'] },
  { title:'Налоги', items:['vat','cit','payroll'] },
  { title:'Учёт', items:['counterparties','journal'] },
  { title:'МСФО', items:['ifrs16','ifrs9','ifrs15','ias21','ias2','ias16','ias37','ias12'] },
  { title:'Закрытие', items:['close'] },
  { title:'Система', items:['data','rules','settings'] }
];

/* ---------- rules ---------- */
const RULES = [];
const rule = def => RULES.push(def);
const TAXCODE = 'Налоговый кодекс РК (действует с 01.01.2026)';

rule({ id:'esf_revoked', mod:'vat', sev:'crit', name:'Отозванные и аннулированные ЭСФ остаются в учёте', needs:['esf'], run(c){
  return S.data.esf.filter(r => /отозв|аннул/i.test(r.status) && r.inBooks && inP(r.date, c.P)).map(r => {
    const incoming = /^вход/i.test(r.direction);
    return { key:r.number, sev: incoming ? 'crit' : 'warn',
      title: incoming ? 'НДС в зачёт по отозванному ЭСФ' : 'Реализация отражена по отозванному ЭСФ',
      entity: r.counterparty, amount: r.bookVat || r.vat,
      what: `ЭСФ ${r.number} от ${fd(r.date)} имеет статус «${r.status}», но ${incoming ? 'НДС по нему включён в зачёт' : 'реализация осталась в учёте'}.`,
      basis: TAXCODE + ': НДС относится в зачёт только по действительным ЭСФ.',
      fix: incoming ? 'Запросить у поставщика новый ЭСФ или исключить НДС из зачёта до его получения.' : 'Выписать исправленный ЭСФ или скорректировать реализацию.',
      entry: incoming ? `Сторно НДС в зачёт: ${money(r.bookVat || r.vat)}` : 'Корректировка реализации после выписки исправленного ЭСФ' };
  });
}});
rule({ id:'esf_old_rate', mod:'vat', sev:'crit', name:'ЭСФ 2026 года со ставкой ниже базовой', needs:['esf'], run(c){
  const g = {};
  S.data.esf.filter(r => inP(r.date, c.P) && r.date >= '2026-01-01' && r.rate > 0 && r.rate < S.settings.vatRate && !/отозв|аннул/i.test(r.status)).forEach(r => {
    const k = r.counterparty + '|' + r.rate; (g[k] = g[k] || { cp:r.counterparty, rate:r.rate, rows:[], dir:r.direction }).rows.push(r);
  });
  return Object.values(g).map(x => {
    const under = sum(x.rows, r => r.net * (S.settings.vatRate - x.rate) / 100);
    return { key: x.cp + x.rate, title:`Ставка НДС ${x.rate}% вместо ${S.settings.vatRate}%`, entity:x.cp, amount: under,
      what:`${x.rows.length} ${plural(x.rows.length,'ЭСФ','ЭСФ','ЭСФ')} за период (${x.dir}) выписаны по ставке ${x.rate}%. ${/^исх/i.test(x.dir) ? 'НДС к уплате занижен' : 'НДС в зачёте рассчитан неверно'}.`,
      basis: TAXCODE + ': базовая ставка НДС 16%. Пониженные ставки применяются только к отдельным операциям.',
      fix:'Выписать исправленные ЭСФ и проверить ставку в настройках 1С. Если применяется законная пониженная ставка, отметьте «Это не ошибка».',
      entry:`Доначисление НДС: ${money(under)}` };
  });
}});
rule({ id:'esf_not_in_books', mod:'vat', sev:'warn', name:'ЭСФ не отражён в учёте', needs:['esf'], run(c){
  return S.data.esf.filter(r => inP(r.date, c.P) && !r.inBooks && !/отозв|аннул/i.test(r.status)).map(r => {
    const incoming = /^вход/i.test(r.direction);
    return { key:r.number, sev: incoming ? 'warn' : 'crit', title: incoming ? 'ЭСФ поставщика не отражён в учёте' : 'Исходящий ЭСФ без реализации в учёте', entity:r.counterparty, amount:r.vat,
      what: incoming ? `Поставщик выписал ЭСФ ${r.number} на ${money(r.net + r.vat)}, но поступления в учёте нет. Теряется зачёт НДС или не отражён расход.` : `ЭСФ ${r.number} выписан покупателю, а реализации в учёте нет. Риск занижения оборота.`,
      basis:'Сверка данных ИС ЭСФ с учётом.', fix: incoming ? 'Проверить факт поставки и провести документ поступления.' : 'Провести реализацию или отозвать ЭСФ.',
      entry: incoming ? `Дт Запасы или расходы / Кт Кредиторская задолженность; НДС в зачёт ${money(r.vat)}` : 'Отражение реализации' };
  });
}});
rule({ id:'esf_vat_mismatch', mod:'vat', sev:'warn', name:'НДС в учёте не совпадает с ЭСФ', needs:['esf'], run(c){
  return S.data.esf.filter(r => inP(r.date, c.P) && r.inBooks && Math.abs((r.bookVat || 0) - (r.vat || 0)) > 1).map(r => ({
    key:r.number, title:'НДС в учёте расходится с ЭСФ', entity:r.counterparty, amount:Math.abs(r.bookVat - r.vat),
    what:`По ЭСФ ${r.number} НДС ${money(r.vat)}, в учёте ${money(r.bookVat)}.`, basis:'Сверка данных ИС ЭСФ с учётом.',
    fix:'Найти ошибку в документе 1С и исправить сумму НДС.', entry:`Корректировка НДС на ${money(r.vat - r.bookVat)}` }));
}});

rule({ id:'kpn_nondeductible', mod:'cit', sev:'warn', name:'Расходы, не принимаемые в вычет, отнесены на вычет', needs:['deductions'], run(){
  const cats = S.settings.nonDeductible.split(';').map(x => x.trim().toLowerCase()).filter(Boolean);
  return S.data.deductions.filter(r => r.deducted && cats.includes((r.category || '').trim().toLowerCase())).map((r, i) => ({
    key: i + r.expense, title:'Невычитаемый расход в вычетах по КПН', entity:r.expense, amount:r.amount,
    what:`Расход отнесён на вычет, но категория «${r.category}» не принимается в вычет. Эффект на КПН: ${money(r.amount * S.settings.citRate / 100)}.`,
    basis: TAXCODE + ': перечень расходов, не принимаемых в вычет по КПН. Список категорий настраивается налоговым экспертом.',
    fix:'Исключить расход из вычетов при расчёте КПН.', entry:`Налоговый учёт: исключить из вычетов ${money(r.amount)}` }));
}});

rule({ id:'pay_deduction', mod:'payroll', sev:'warn', name:'Базовый вычет применён не в размере 30 МРП', needs:['payroll'], run(){
  const base = S.settings.baseDeduction, mrp = S.settings.mrp;
  return S.data.payroll.filter(p => (p.deductionMRP || 0) !== base).map(p => {
    const eff = Math.abs(base - (p.deductionMRP || 0)) * mrp * 0.1;
    return { key:p.name, title: (p.deductionMRP || 0) < base ? 'Вычет применён в старом размере' : 'Вычет больше установленного', entity:p.name, amount:eff,
      what:`Применён вычет ${p.deductionMRP} МРП вместо ${base} МРП. ИПН ${(p.deductionMRP || 0) < base ? 'удержан больше' : 'удержан меньше'}, чем нужно, примерно на ${money(eff)} в месяц.`,
      basis: TAXCODE + ': базовый налоговый вычет 30 МРП в месяц.', fix:'Обновить настройки вычетов сотрудника в 1С и пересчитать ИПН.',
      entry:`Перерасчёт ИПН: ${money(eff)}` };
  });
}});
rule({ id:'pay_ipn', mod:'payroll', sev:'info', name:'ИПН расходится с упрощённым пересчётом', needs:['payroll'], run(){
  return S.data.payroll.filter(p => Math.abs((p.ipn || 0) - ipnExpected(p)) > 500 && p.salary * 12 <= 8500 * S.settings.mrp).map(p => ({
    key:p.name, title:'ИПН не совпадает с пересчётом', entity:p.name, amount:Math.abs(p.ipn - ipnExpected(p)),
    what:`Удержано ${money(p.ipn)}, по упрощённому пересчёту ${money(ipnExpected(p))}.`, basis:'Упрощённый расчёт: (начислено − ОПВ 10% − ВОСМС 2% − вычет) × 10%.',
    fix:'Проверить корректировки и льготы сотрудника. Если расчёт верен, отметьте «Это не ошибка».', entry:'Перерасчёт ИПН при подтверждении ошибки' }));
}});
rule({ id:'pay_progressive', mod:'payroll', sev:'info', name:'Доход выше 8 500 МРП в год: ставка 15%', needs:['payroll'], run(){
  const lim = 8500 * S.settings.mrp;
  return S.data.payroll.filter(p => p.salary * 12 > lim).map(p => {
    const extra = (p.salary * 12 - lim) * 0.05 / 12;
    return { key:p.name, title:'Проверьте ставку ИПН 15%', entity:p.name, amount:extra,
      what:`Годовой доход в пересчёте ${money(p.salary * 12)} превышает 8 500 МРП (${money(lim)}). К превышению применяется ставка 15%. Ориентировочная доплата: ${money(extra)} в месяц.`,
      basis: TAXCODE + ': ставка ИПН 15% для доходов свыше 8 500 МРП в год.', fix:'Проверить, учитывает ли 1С прогрессивную ставку для этого сотрудника.', entry:'Доудержание ИПН при подтверждении' };
  });
}});

rule({ id:'cp_kgd', mod:'counterparties', sev:'crit', name:'Контрагент не действующий по данным КГД', needs:['counterparties','entries'], run(c){
  return S.data.counterparties.filter(x => x.kgd && x.kgd.trim().toLowerCase() !== 'действующий').map(x => {
    const t = turnover(x.name, c.P);
    return { key:x.name, title:`Контрагент: «${x.kgd}»`, entity:x.name, amount:t || null,
      what:`По данным КГД статус контрагента «${x.kgd}». Операции за период: ${money(t)}. Вычеты по КПН и зачёт НДС по таким сделкам под риском исключения.`,
      basis: TAXCODE + ': ограничения по вычетам и зачёту НДС по сделкам с бездействующими и недобросовестными налогоплательщиками.',
      fix:'Проверить реальность сделок, собрать подтверждающие документы, решить вопрос о корректировке вычетов и зачёта.', entry:'Решение принимает главный бухгалтер' };
  });
}});
rule({ id:'cp_contract', mod:'counterparties', sev:'warn', name:'Договор истёк, а операции продолжаются', needs:['counterparties','entries'], run(c){
  return S.data.counterparties.filter(x => x.contractEnd).map(x => {
    const end = D(x.contractEnd);
    const after = S.data.entries.filter(e => e.counterparty === x.name && inP(e.date, c.P) && D(e.date) > end && !isPay(e));
    return after.length ? { key:x.name, title:'Операции после окончания договора', entity:x.name, amount:sum(after, e => e.amount),
      what:`Договор действовал до ${fd(x.contractEnd)}, а за период проведено ${after.length} ${plural(after.length,'операция','операции','операций')}.`,
      basis:'Подтверждение расходов договором и первичными документами.', fix:'Продлить договор допсоглашением или оформить новый.', entry:'Корректировка не нужна после оформления договора' } : null;
  }).filter(Boolean);
}});
rule({ id:'cp_nocontract', mod:'counterparties', sev:'warn', name:'Нет договора с контрагентом', needs:['counterparties','entries'], run(c){
  return S.data.counterparties.filter(x => !x.contractEnd).map(x => {
    const t = turnover(x.name, c.P);
    return t ? { key:x.name, title:'Операции без договора', entity:x.name, amount:t, what:`С контрагентом нет договора в справочнике, а операции за период составили ${money(t)}.`,
      basis:'Подтверждение расходов договором и первичными документами.', fix:'Заключить договор и внести его в 1С.', entry:'—' } : null;
  }).filter(Boolean);
}});
rule({ id:'cp_act', mod:'counterparties', sev:'warn', name:'Акт сверки расходится с учётом', needs:['counterparties'], run(){
  return S.data.counterparties.filter(x => x.actBalance != null && Math.abs((x.bookBalance || 0) - x.actBalance) > 1).map(x => ({
    key:x.name, title:'Акт сверки расходится с учётом', entity:x.name, amount:Math.abs(x.bookBalance - x.actBalance),
    what:`В учёте ${money(x.bookBalance)}, по акту сверки ${money(x.actBalance)}.`, basis:'Сверка взаиморасчётов на конец периода.',
    fix:'Найти расхождение по документам: непроведённая накладная, оплата или возврат.', entry:'Зависит от результата сверки' }));
}});
rule({ id:'cp_stale', mod:'counterparties', sev:'info', name:'Задолженность без движения больше 3 лет', needs:['counterparties'], run(c){
  return S.data.counterparties.filter(x => x.lastMovement && Math.abs(x.bookBalance || 0) > 0 && (mi(c.P.end) - mi(D(x.lastMovement))) >= 36).map(x => ({
    key:x.name, title:'Истекает срок исковой давности', entity:x.name, amount:Math.abs(x.bookBalance),
    what:`Последнее движение ${fd(x.lastMovement)}, сальдо ${money(x.bookBalance)}.`, basis:'Гражданский кодекс РК: общий срок исковой давности 3 года. Списание влияет на доходы и КПН.',
    fix:'Подтвердить долг актом сверки или списать.', entry:`Дт Кредиторская задолженность / Кт Прочие доходы: ${money(Math.abs(x.bookBalance))}` }));
}});
rule({ id:'je_nodoc', mod:'counterparties', sev:'warn', name:'Проводки без первичных документов', needs:['entries'], run(c){
  const g = {};
  S.data.entries.filter(e => inP(e.date, c.P) && !e.hasDoc).forEach(e => { const k = e.counterparty || 'Без контрагента'; (g[k] = g[k] || []).push(e); });
  return Object.entries(g).map(([k, rows]) => ({ key:k, title:`${rows.length} ${plural(rows.length,'проводка','проводки','проводок')} без первички`, entity:k, amount:sum(rows, e => e.amount),
    what:`Не приложены первичные документы: ${rows.map(e => e.doc).join(', ')}. Без первички расходы не подтверждены для вычетов по КПН.`,
    basis: TAXCODE + ': расходы на вычет подтверждаются первичными документами.', fix:'Запросить документы у контрагента и прикрепить в 1С.', entry:'Корректировка не нужна после получения документов' }));
}});
rule({ id:'je_dup', mod:'counterparties', sev:'crit', name:'Возможная двойная оплата', needs:['entries'], run(c){
  const g = {};
  S.data.entries.filter(e => inP(e.date, c.P) && e.doc).forEach(e => { const k = e.doc + '|' + e.counterparty + '|' + e.amount + '|' + e.debit + '|' + e.credit; (g[k] = g[k] || []).push(e); });
  return Object.values(g).filter(r => r.length > 1).map(r => ({ key:r[0].doc + r[0].counterparty, title:'Возможная двойная оплата', entity:r[0].counterparty, amount:r[0].amount * (r.length - 1),
    what:`Документ ${r[0].doc} на ${money(r[0].amount)} проведён ${r.length} раза: ${r.map(e => fd(e.date)).join(', ')}.`, basis:'Контроль дублей в журнале проводок.',
    fix:'Проверить банковскую выписку. Если оплата ушла дважды, запросить возврат или зачесть в счёт будущих поставок.', entry:'Сторно дубля, если оплаты не было' }));
}});
rule({ id:'je_regular', mod:'journal', sev:'warn', name:'Пропущено регулярное начисление', needs:['entries'], run(c){
  const months = [1,2,3].map(k => mi(c.P.start) - k);
  const map = {};
  S.data.entries.forEach(e => { const d = D(e.date); if (!d || isPay(e) || !e.counterparty) return; const k = e.counterparty + '|' + e.description; (map[k] = map[k] || { months:new Set(), amounts:[], cp:e.counterparty, ds:e.description, debit:e.debit }); map[k].months.add(mi(d)); if (months.includes(mi(d))) map[k].amounts.push(e.amount); });
  return Object.values(map).filter(x => months.every(m => x.months.has(m)) && !x.months.has(mi(c.P.start))).map(x => {
    const avg = sum(x.amounts, a => a) / x.amounts.length;
    return { key:x.cp + x.ds, title:`Нет начисления: ${x.ds.toLowerCase()}`, entity:x.cp, amount:avg,
      what:`Начисление «${x.ds}» было в каждом из трёх предыдущих месяцев (в среднем ${money(avg)}), а за ${c.P.label} отсутствует.`,
      basis:'Принцип начисления: расходы признаются в периоде, к которому относятся.', fix:'Запросить акт за период или начислить расход по оценке.',
      entry:`Дт ${x.debit} / Кт 3310: ${money(avg)}` };
  });
}});
rule({ id:'je_anomaly', mod:'journal', sev:'info', name:'Крупная круглая проводка в выходной день', needs:['entries'], run(c){
  return S.data.entries.filter(e => { const d = D(e.date); return inP(e.date, c.P) && e.amount >= 1000000 && e.amount % 100000 === 0 && (d.getUTCDay() === 0 || d.getUTCDay() === 6); }).map(e => ({
    key:e.doc + e.date, title:'Нетипичная проводка', entity:e.description || e.doc, amount:e.amount,
    what:`${e.doc} от ${fd(e.date)} (выходной день): Дт ${e.debit} / Кт ${e.credit} на круглую сумму ${money(e.amount)}.`, basis:'Аналитика журнала проводок: признаки ошибок и манипуляций.',
    fix:'Проверить основание и кто провёл корректировку.', entry:'—' }));
}});

rule({ id:'lease_unrecognized', mod:'ifrs16', sev:'crit', name:'Аренда не признана по МСФО 16', needs:['leases'], run(c){
  return S.data.leases.filter(l => !l.recognized && l.term > 12).map(l => { const k = leaseCalc(l, c.P);
    return { key:l.counterparty + l.object, title:`Аренда не признана: ${l.object.toLowerCase()}`, entity:l.counterparty, amount:k.liability,
      what:`Договор на ${l.term} мес. с платежом ${money(l.payment)} учитывается как расход. По МСФО 16 нужно признать актив и обязательство. Расчёт на конец периода: обязательство ${moneyM(k.liability)}, актив ${moneyM(k.rou)} (ставка ${l.rate}% годовых, осталось ${k.remaining} мес.).`,
      basis:'МСФО (IFRS) 16 «Аренда».', fix:'Подтвердить срок аренды (с учётом опционов продления) и ставку дисконтирования, затем признать актив и обязательство.',
      entry:`Дт Актив в форме права пользования ${money(k.rou)} / Кт Обязательство по аренде ${money(k.liability)}; разница в нераспределённую прибыль и расходы периода` }; });
}});
rule({ id:'lease_mismatch', mod:'ifrs16', sev:'warn', name:'Обязательство по аренде не совпадает с расчётом', needs:['leases'], run(c){
  return S.data.leases.filter(l => l.recognized).map(l => { const k = leaseCalc(l, c.P); const diff = (l.bookLiability || 0) - k.liability;
    return k.liability > 0 && Math.abs(diff) / k.liability > 0.02 ? { key:l.counterparty + l.object, title:'Обязательство по аренде расходится с расчётом', entity:l.counterparty, amount:Math.abs(diff),
      what:`В учёте ${money(l.bookLiability)}, расчёт по графику ${money(k.liability)}. Возможны неучтённая модификация договора, индексация или ошибка в процентах.`,
      basis:'МСФО (IFRS) 16 «Аренда».', fix:'Сверить график платежей с договором и допсоглашениями, пересчитать обязательство.', entry:`Корректировка обязательства на ${money(-diff)}` } : null; }).filter(Boolean);
}});
rule({ id:'ecl_reserve', mod:'ifrs9', sev:'warn', name:'Резерв под ожидаемые кредитные убытки', needs:['receivables'], run(){

    what:`По матрице просрочки нужен резерв ${money(e.required)}, в учёте ${money(e.booked)}.`, basis:'МСФО (IFRS) 9 «Финансовые инструменты», упрощённый подход для торговой дебиторки.',
    fix:'Проверить ставки матрицы на исторических данных и начислить разницу.', entry: diff > 0 ? `Дт Расходы по ожидаемым кредитным убыткам / Кт Резерв: ${money(diff)}` : `Восстановление резерва: ${money(-diff)}` }];

rule({ id:'loan_discount', mod:'ifrs9', sev:'warn', name:'Займ по нерыночной ставке не дисконтирован', needs:['loans'], run(){

rule({ id:'rev_cutoff', mod:'ifrs15', sev:'crit', name:'Выручка признана до передачи контроля', needs:['revenue'], run(c){

rule({ id:'fx_monetary', mod:'ias21', sev:'warn', name:'Денежные статьи не переоценены по курсу на конец периода', needs:['fx'], run(){

rule({ id:'inv_nrv', mod:'ias2', sev:'warn', name:'Запасы не уценены до чистой цены продажи', needs:['inventory'], run(){

rule({ id:'prov_discount', mod:'ias37', sev:'warn', name:'Долгосрочный резерв не дисконтирован', needs:['provisions'], run(){

    entry:`Корректировка отложенного налога: ${money(diff)}` }] : [];

/* ---------- engine ---------- */
function runAll(){
  const c = { P: period() }; const out = [];
  for (const r of RULES) {
    if (S.rulesOff[r.id]) continue;
    if (r.needs.some(n => !(S.data[n] && S.data[n].length))) continue;
    let res = [];
    try { res = r.run(c) || []; } catch(e) { console.error(r.id, e); }
    for (const x of res) {
      if (x.amount != null && x.amount > 0 && x.amount < S.settings.threshold) continue;
      const id = r.id + ':' + x.key;
      const sev = x.sev || r.sev;
      out.push(Object.assign({}, x, { id, sev, rule:r.id, mod:r.mod, status: S.statuses[id] || 'new' }));
    }
  }
  const ord = { crit:0, warn:1, info:2 };
  out.sort((a, b) => ord[a.sev] - ord[b.sev] || (b.amount || 0) - (a.amount || 0));
  return out;
}
const isOpen = s => s.status === 'new' || s.status === 'work';
const SEV = { crit:'Критично', warn:'Внимание', info:'К сведению' };
const STATUS = { new:'Новый', work:'В работе', fixed:'Исправлено', dismissed:'Не ошибка' };

const TASKS = [
  { id:'load', t:'Загрузить данные из 1С', auto:'data' },
  { id:'esf', t:'Сверить ЭСФ с учётом', rules:['esf_'] },
  { id:'kgd', t:'Проверить контрагентов по КГД', rules:['cp_kgd'] },
  { id:'acts', t:'Сверить расчёты и первичку с контрагентами', rules:['cp_act','cp_contract','cp_nocontract','je_nodoc','je_dup','cp_stale'] },
  { id:'accr', t:'Начислить регулярные расходы', rules:['je_regular'] },
  { id:'pay', t:'Проверить зарплатные налоги', rules:['pay_'] },
  { id:'kpn', t:'Проверить вычеты по КПН', rules:['kpn_'] },
  { id:'fa', t:'Начислить амортизацию', rules:['fa_'] },
  { id:'fx', t:'Переоценить валютные статьи', rules:['fx_'] },
  { id:'inv', t:'Оценить запасы', rules:['inv_'] },
  { id:'prov', t:'Начислить резервы', rules:['prov_'] },
  { id:'rev', t:'Проверить признание выручки', rules:['rev_'] },
  { id:'lease', t:'Корректировки по аренде (МСФО 16)', rules:['lease_'] },
  { id:'fin', t:'Резервы и займы (МСФО 9)', rules:['ecl_','loan_'] },
  { id:'dt', t:'Рассчитать отложенный налог', rules:['dt_'] },
  { id:'anom', t:'Разобрать нетипичные проводки', rules:['je_anomaly'] },
  { id:'approve', t:'Утверждение главным бухгалтером', manual:true }
];
function taskStatus(t, strikes){
  if (t.auto === 'data') { const n = DS_ORDER.filter(k => S.data[k].length).length; return n ? { s:'done', txt:`Загружено наборов: ${n} из ${DS_ORDER.length}` } : { s:'nodata', txt:'Нет данных' }; }
  if (t.manual) return S.tasks[t.id] ? { s:'done', txt:'Выполнено' } : { s:'manual', txt:'Ожидает' };
  const rs = RULES.filter(r => t.rules.some(p => r.id.startsWith(p)) && !S.rulesOff[r.id]);
  const hasData = rs.some(r => r.needs.every(n => S.data[n] && S.data[n].length));
  if (!hasData) return { s:'nodata', txt:'Нет данных' };
  const open = strikes.filter(x => isOpen(x) && rs.some(r => r.id === x.rule));
  if (!open.length) return { s:'done', txt:'Готово' };
  const crit = open.filter(x => x.sev === 'crit').length;
  return { s: crit ? 'open' : 'warn', txt:`Открыто: ${open.length}`, n: open.length, link: rs[0].mod };
}

/* ---------- view helpers ---------- */
const sevBadge = s => `<span class="badge b-${s}">${SEV[s]}</span>`;
function strikeItem(x, showMod){
  return `<button type="button" class="strike ${isOpen(x) ? '' : 'closed'}" data-act="open" data-id="${esc(x.id)}">
    ${sevBadge(x.sev)}
    <span><span class="strike-title">${esc(x.title)}</span><br><span class="strike-meta">${esc(x.entity || '')}${showMod ? ' · ' + esc(MODS[x.mod].t) : ''}</span></span>
    <span><span class="strike-amt">${x.amount != null ? esc(moneyM(x.amount)) : '—'}</span><br><span class="strike-status">${STATUS[x.status]}</span></span>
  </button>`;
}
function strikeList(list, showMod, emptyText){
  if (!list.length) return `<div class="empty">${esc(emptyText || 'Страйков нет.')}</div>`;
  return `<div class="strikes">${list.map(x => strikeItem(x, showMod)).join('')}</div>`;
}
function table(cols, rows, opts){
  opts = opts || {};
  const head = cols.map(c => `<th class="${c.num ? 'num' : ''}" scope="col">${esc(c.h)}</th>`).join('');
  const body = rows.map((r, i) => `<tr class="${opts.rowClass ? opts.rowClass(r, i) : ''}">${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.html ? c.html(r, i) : esc(c.f(r, i))}</td>`).join('')}</tr>`).join('');
  const foot = opts.foot ? `<tfoot><tr>${opts.foot.map((f, i) => `<td class="${cols[i] && cols[i].num ? 'num' : ''}">${f}</td>`).join('')}</tr></tfoot>` : '';
  return `<div class="scroll"><table class="tbl" style="min-width:${opts.min || 640}px"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}
function noData(mod){
  const need = (MODS[mod].needs || []).filter(n => !S.data[n].length).map(n => '«' + SCHEMAS[n].title + '»');
  return need.length ? `<div class="empty">Нет данных: ${esc(need.join(', '))}. <a href="#/data">Загрузите их на странице «Данные»</a> или верните демо-данные.</div>` : '';
}
function moduleHead(mod, strikes){
  const m = MODS[mod]; const P = period();
  const mine = strikes.filter(x => x.mod === mod); const open = mine.filter(isOpen);
  return `<div class="crumbs">${esc(S.settings.company)}, ${esc(P.label)}${m.group ? ' · ' + esc(m.group) : ''}</div>
  <div class="page-head"><div><h1>${esc(m.t)}${m.code ? ' <span class="t-muted" style="font-weight:500;font-size:.7em">' + esc(m.code) + '</span>' : ''}</h1><p class="lead">${esc(m.desc || '')}</p></div></div>
  ${noData(mod)}
  <section class="panel"><h2>Страйки раздела: ${open.length} ${plural(open.length,'открыт','открыто','открыто')}</h2>${strikeList(mine, false, 'Проверки раздела не нашли проблем.')}</section>`;
}
const flagCls = (crit, warn) => crit ? 'flag-crit' : (warn ? 'flag' : '');

/* ---------- views ---------- */

const norm = s => String(s == null ? '' : s).toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9%]/g, '');
function toIso(v){
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())).toISOString().slice(0, 10);
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return isNaN(d) ? '' : d.toISOString().slice(0, 10); }
  const s = String(v).trim(); let m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m = /^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/.exec(s))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
const toNum = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[\s\u00a0₸]/g, '').replace(',', '.')); return isNaN(n) ? null : n; };
const toBool = v => /^(да|yes|true|1|\+|y|д)$/i.test(String(v == null ? '' : v).trim());
function mapRows(key, raw){
  const s = SCHEMAS[key]; if (!raw.length) throw new Error('В файле нет строк.');
  const headers = Object.keys(raw[0]); const idx = {};
  s.cols.forEach(c => { const h = headers.find(h => norm(h) === norm(c[1]) || norm(h) === norm(c[0])); if (h) idx[c[0]] = h; });
  const missing = s.cols.filter(c => !idx[c[0]]).map(c => c[1]);
  if (missing.length > Math.floor(s.cols.length / 2)) throw new Error('Не найдены колонки: ' + missing.join(', ') + '. Проверьте заголовки по шаблону.');
  const rows = raw.map(r => { const o = {}; s.cols.forEach(([k, , t]) => { const v = idx[k] ? r[idx[k]] : ''; o[k] = t === 'd' ? toIso(v) : t === 'n' ? (k === 'actBalance' ? toNum(v) : (toNum(v) || 0)) : t === 'b' ? toBool(v) : String(v == null ? '' : v).trim(); }); return o; })
    .filter(o => s.cols.some(([k, , t]) => t !== 'b' && o[k] !== '' && o[k] !== 0 && o[k] != null));
  return { rows, missing };
}
function parseCsv(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur.replace(/\r$/, '')); out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur.replace(/\r$/, '')); out.push(row); }
  const head = out.shift() || [];
  return out.filter(r => r.some(c => c.trim() !== '')).map(r => { const o = {}; head.forEach((h, i) => o[h.trim()] = r[i] == null ? '' : r[i]); return o; });
}
async function readFile(key, file){
  try {
    let raw;
    if (/\.(xlsx|xls)$/i.test(file.name)) {
      if (!window.XLSX) throw new Error('Модуль Excel не загрузился. Сохраните файл как CSV и загрузите снова.');
      const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
      raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'', raw:true });
    } else {
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) { try { text = new TextDecoder('windows-1251').decode(buf); } catch(e) {} }
      raw = parseCsv(text);
    }
    const { rows, missing } = mapRows(key, raw);
    S.data[key] = rows; S.source[key] = 'file:' + file.name; save();
    UI.msg[key] = { ok:true, text:`Загружено строк: ${rows.length}.` + (missing.length ? ' Не найдены колонки: ' + missing.join(', ') + ' (заполнены пустыми значениями).' : '') };
  } catch(e) { UI.msg[key] = { ok:false, text: e.message || 'Не удалось прочитать файл.' }; }
  render();
}
const csvCell = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
async function offerFile(filename, text){
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl) {
      const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }
    await dl.save({ filename, data: '\uFEFF' + text });
  } catch(e) { if (e && e.code !== 'declined') toast('Файл не сохранён.'); }
}
function template(key){
  const s = SCHEMAS[key]; const demo = demoData()[key].slice(0, 3);
  const lines = [s.cols.map(c => csvCell(c[1])).join(';')].concat(demo.map(r => s.cols.map(([k, , t]) => csvCell(t === 'd' ? fd(r[k]).replace('—','') : t === 'b' ? (r[k] ? 'да' : 'нет') : (r[k] == null ? '' : r[k]))).join(';')));
  offerFile('shablon-' + key + '.csv', lines.join('\r\n'));
}
function exportStrikes(){
  const st = runAll(); const head = ['Важность','Раздел','Страйк','Контрагент или объект','Сумма','Статус','Что не так','Основание','Как исправить','Корректировка'];
  const lines = [head.join(';')].concat(st.map(x => [SEV[x.sev], MODS[x.mod].t, x.title, x.entity, x.amount != null ? Math.round(x.amount) : '', STATUS[x.status], x.what, x.basis, x.fix, x.entry].map(csvCell).join(';')));
  offerFile('straiki-' + S.settings.period + '.csv', lines.join('\r\n'));
}

/* ---------- AI ---------- */
UI.sampleOk = false;
(async () => { try { const s = window.claude && window.claude.use ? await window.claude.use('sample') : null; if (s) { UI.sample = s; UI.sampleOk = true; if (UI.open) render(); } } catch(e) {} })();
async function explain(id){
  const x = runAll().find(s => s.id === id); if (!x || !UI.sample) return;
  UI.aiBusy[id] = true; UI.ai[id] = 'Claude думает…'; render();
  const prompt = `Ты помогаешь главному бухгалтеру казахстанской компании объяснить проблему в учёте директору. Напиши 3–4 коротких предложения простым языком, без markdown и без списков: что произошло, чем грозит компании и что нужно сделать. Не придумывай новых фактов и сумм.\n\nПроблема: ${x.title}\nКонтрагент или объект: ${x.entity}\nСумма: ${x.amount != null ? money(x.amount) : 'не указана'}\nОписание: ${x.what}\nОснование: ${x.basis}\nКак исправить: ${x.fix}`;
  try {
    const res = await UI.sample(prompt, { modelTier:'quick', onText: ({ text }) => { UI.ai[id] = text; const el = document.getElementById('ai-out'); if (el && UI.open === id) el.textContent = text; } });
    UI.ai[id] = res.text;
  } catch(e) {
    if (e && e.code === 'not_granted') { UI.sampleOk = false; delete UI.ai[id]; }
    else UI.ai[id] = (e && e.text) || 'Не удалось получить объяснение. Попробуйте позже.';
  }
  UI.aiBusy[id] = false; render();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'open') { UI.open = el.dataset.id; UI.focusDrawer = true; render(); }
  else if (a === 'close-drawer') { UI.open = null; render(); }
  else if (a === 'status') { const v = el.dataset.v; if (v === 'new') delete S.statuses[el.dataset.id]; else S.statuses[el.dataset.id] = v; save(); render(); }
  else if (a === 'sev') { UI.sev = el.dataset.v; render(); }
  else if (a === 'nav') { UI.navOpen = !UI.navOpen; render(); }
  else if (a === 'lease') { UI.leaseSel = +el.dataset.i; render(); }
  else if (a === 'export') exportStrikes();
  else if (a === 'tpl') template(el.dataset.k);
  else if (a === 'demo') { const k = el.dataset.k; S.data[k] = demoData()[k]; S.source[k] = 'demo'; UI.msg[k] = { ok:true, text:'Демо-данные восстановлены.' }; save(); render(); }
  else if (a === 'clear') { const k = el.dataset.k; S.data[k] = []; S.source[k] = 'empty'; UI.msg[k] = null; save(); render(); }
  else if (a === 'demo-all') { const d = demoData(); DS_ORDER.forEach(k => { S.data[k] = d[k]; S.source[k] = 'demo'; }); UI.msg = {}; save(); toast('Демо-данные восстановлены.'); }
  else if (a === 'clear-all') { DS_ORDER.forEach(k => { S.data[k] = []; S.source[k] = 'empty'; }); UI.msg = {}; save(); toast('Все данные очищены.'); }
  else if (a === 'reset') { S = fresh(); UI.msg = {}; save(); toast('Всё сброшено к исходным значениям.'); }
  else if (a === 'ai') explain(el.dataset.id);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.file) { const f = el.files && el.files[0]; if (f) readFile(el.dataset.file, f); return; }
  const c = el.dataset.change; if (!c) return;
  if (c === 'mod') UI.mod = el.value;
  else if (c === 'status') UI.status = el.value;
  else if (c === 'q') UI.q = el.value;
  else if (c === 'ecl') { S.settings.ecl[+el.dataset.i] = Math.max(0, Math.min(100, parseFloat(el.value) || 0)); save(); }
  else if (c === 'rate') { S.settings.rates[el.dataset.c] = parseFloat(el.value) || 0; save(); }
  else if (c === 'task') { S.tasks[el.dataset.id] = el.checked; save(); }
  else if (c === 'rule') { if (el.checked) delete S.rulesOff[el.dataset.id]; else S.rulesOff[el.dataset.id] = true; save(); }
  else if (c === 'set') { const k = el.dataset.k; const num = typeof DEFAULT_SETTINGS[k] === 'number'; S.settings[k] = num ? (parseFloat(el.value) || 0) : el.value; if (k === 'period' && !/^\d{4}-\d{2}$/.test(el.value)) S.settings.period = DEFAULT_SETTINGS.period; save(); }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.open) { UI.open = null; render(); } });
window.addEventListener('hashchange', () => { UI.navOpen = false; UI.open = null; render(); window.scrollTo(0, 0); });

load();
render();
})();
</script>
